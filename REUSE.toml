version = 1

# Files that cannot carry an SPDX header (generated, binary, or data formats
# where comments are not allowed) and documentation or prose. Everything else
# carries its own header. To license documentation separately from the code (for
# example CC-BY-4.0), split the prose paths into their own block and add
# LICENSES/CC-BY-4.0.txt via `reuse download`.

[[annotations]]
path = [
  "uv.lock",
  ".python-version",
  "codemeta.json",
  "CITATION.cff",
  ".github/**",
  ".vscode/**",
  "LICENSE",
  "src/project_name/py.typed",
  "README.md",
  "CHANGELOG.md",
  "CONTRIBUTING.md",
  "CODE_OF_CONDUCT.md",
  "GOVERNANCE.md",
  "SECURITY.md",
  "AGENTS.md",
  "docs/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Your Name"
SPDX-License-Identifier = "MIT"
