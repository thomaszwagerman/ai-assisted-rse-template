[project]
name = "project-name"
version = "0.1.0"
description = "One-line description of the project."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSES/*.txt"]
authors = [{ name = "Your Name", email = "you@example.org" }]
keywords = ["research-software"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/thomaszwagerman/ai-assisted-rse-template"
Documentation = "https://thomaszwagerman.github.io/ai-assisted-rse-template/"
Repository = "https://github.com/thomaszwagerman/ai-assisted-rse-template"
Issues = "https://github.com/thomaszwagerman/ai-assisted-rse-template/issues"
Changelog = "https://github.com/thomaszwagerman/ai-assisted-rse-template/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "cffconvert>=2.0",
    "mypy>=1.10",
    "pre-commit>=4.7.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "reuse>=5.0",
    "ruff>=0.17.2",
    "validate-pyproject>=0.27",
]
docs = [
    "mkdocstrings-python>=2.0.10",
    "zensical>=0.0.71",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "NPY", # numpy
    "D",   # pydocstyle
    "RUF", # ruff-specific
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"scripts/**" = ["D"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--cov=project_name",
    "--cov-report=term-missing",
]

[tool.coverage.run]
branch = true
